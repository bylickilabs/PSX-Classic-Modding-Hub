name: PSx Struktur Monitor

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: psx-structure-monitor
  cancel-in-progress: false

jobs:
  structure-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Aktuellen Main-Branch synchronisieren
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Upstream-Strukturen prüfen und README aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]

          projects = {
              "BleemSync": {
                  "repo": "pathartl/BleemSync.Payload.PlayStationClassic",
                  "required": [
                      "bleemsync",
                      "bleemsync/etc",
                      "bleemsync/etc/bleemsync",
                      "bleemsync/etc/boot_menu",
                      "bleemsync/opt",
                      "bleemsync/opt/retroarch",
                  ],
              },
              "AutoBleem": {
                  "repo": "autobleem/AutoBleem",
                  "required": [
                      "payload/Autobleem",
                      "payload/Autobleem/bin",
                      "payload/Autobleem/bin/autobleem",
                      "payload/Autobleem/bin/emu",
                      "payload/Autobleem/rc",
                      "payload/Games",
                      "payload/themes",
                  ],
              },
              "Project Eris": {
                  "repo": "Project-Eris-psc/Project-Eris-Payload",
                  "required": [
                      "Payload.PlayStationClassic/project_eris",
                      "Payload.PlayStationClassic/project_eris/etc",
                      "Payload.PlayStationClassic/project_eris/etc/boot_menu",
                      "Payload.PlayStationClassic/project_eris/etc/project_eris",
                      "Payload.PlayStationClassic/project_eris/opt",
                      "Payload.PlayStationClassic/project_eris/opt/emulationstation",
                      "Payload.PlayStationClassic/project_eris/opt/retroarch",
                  ],
              },
          }

          def github_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "BYLICKILABS-PSx-Structure-Monitor",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30,
              ) as response:
                  return json.load(response)

          def inspect_project(project):
              repo = project["repo"]

              try:
                  meta = github_json(
                      f"https://api.github.com/repos/{repo}"
                  )

                  branch = meta["default_branch"]

                  tree_data = github_json(
                      f"https://api.github.com/repos/{repo}/git/trees/"
                      f"{branch}?recursive=1"
                  )

                  if tree_data.get("truncated"):
                      raise RuntimeError(
                          "GitHub-Baumstruktur wurde abgeschnitten"
                      )

                  directories = {
                      item["path"]
                      for item in tree_data.get("tree", [])
                      if item.get("type") == "tree"
                  }

                  missing = [
                      path
                      for path in project["required"]
                      if path not in directories
                  ]

                  return {
                      "ok": len(missing) == 0,
                      "branch": branch,
                      "missing": missing,
                      "error": "",
                  }

              except Exception as exc:
                  return {
                      "ok": False,
                      "branch": "unbekannt",
                      "missing": [],
                      "error": str(exc),
                  }

          def status_text(result):
              if result["ok"]:
                  return "🟢 STABIL"

              if result["error"]:
                  return "🔴 PRÜFUNG FEHLGESCHLAGEN"

              return "🔴 GEÄNDERT"

          results = {
              name: inspect_project(project)
              for name, project in projects.items()
          }

          bleemsync = results["BleemSync"]
          autobleem = results["AutoBleem"]
          eris = results["Project Eris"]

          overall_ok = all(
              result["ok"]
              for result in results.values()
          )

          if bleemsync["ok"]:
              bleemsync_motd = "🟢 UNTERSTÜTZT"
          else:
              bleemsync_motd = "🔴 PRÜFUNG ERFORDERLICH"

          badge = (
              f"[![PSx Struktur Monitor]"
              f"(https://github.com/{repository}/actions/workflows/"
              f"monitor.yml/badge.svg)]"
              f"(https://github.com/{repository}/actions/workflows/"
              f"monitor.yml)"
          )

          block = f"""<!-- PSX-STRUCTURE-MONITOR:START -->

          ### PSx STRUKTUR MONITOR

          {badge}

          | Umgebung | Strukturstatus | MOTD Installer | Upstream-Branch |
          |---|---|---|---|
          | BleemSync | {status_text(bleemsync)} | {bleemsync_motd} | `{bleemsync["branch"]}` |
          | AutoBleem | {status_text(autobleem)} | 🔴 NICHT UNTERSTÜTZT | `{autobleem["branch"]}` |
          | Project Eris | {status_text(eris)} | 🔴 NICHT UNTERSTÜTZT | `{eris["branch"]}` |

          ```text
          bleemsync/
          ├─ etc/
          │  ├─ bleemsync/
          │  └─ boot_menu/
          └─ opt/
             └─ retroarch/
          ```

          ```text
          payload/
          ├─ Autobleem/
          │  ├─ bin/
          │  │  ├─ autobleem/
          │  │  └─ emu/
          │  └─ rc/
          ├─ Games/
          └─ themes/
          ```

          ```text
          Payload.PlayStationClassic/
          └─ project_eris/
             ├─ etc/
             │  ├─ boot_menu/
             │  └─ project_eris/
             └─ opt/
                ├─ emulationstation/
                └─ retroarch/
          ```

          | Status | Bedeutung |
          |---|---|
          | 🟢 `STABIL` | Alle erwarteten Strukturmerkmale wurden erkannt. |
          | 🔴 `GEÄNDERT` | Mindestens ein erwartetes Strukturmerkmal fehlt. |
          | 🔴 `PRÜFUNG FEHLGESCHLAGEN` | Das Upstream-Repository konnte nicht überprüft werden. |

          **BleemSync** ist die aktuell unterstützte Umgebung des MOTD Installers.

          **AutoBleem** und **Project Eris** bleiben für den MOTD Installer `NICHT UNTERSTÜTZT`, bis sie ausdrücklich getestet und freigegeben wurden.

          <!-- PSX-STRUCTURE-MONITOR:END -->"""

          block = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in block.splitlines()
          )

          readme = Path("README.md")

          if not readme.exists():
              raise RuntimeError(
                  "README.md wurde nicht gefunden"
              )

          text = readme.read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r"<!-- PSX-STRUCTURE-MONITOR:START -->.*?"
              r"<!-- PSX-STRUCTURE-MONITOR:END -->",
              re.DOTALL,
          )

          if not pattern.search(text):
              raise RuntimeError(
                  "Der PSx-Struktur-Monitor-Bereich wurde "
                  "in README.md nicht gefunden"
              )

          updated = pattern.sub(
              lambda match: block,
              text,
              count=1,
          )

          readme.write_text(
              updated,
              encoding="utf-8",
          )

          details = []

          for name, result in results.items():
              if result["ok"]:
                  continue

              if result["error"]:
                  details.append(
                      f"{name}: {result['error']}"
                  )
              else:
                  missing = ", ".join(
                      result["missing"]
                  )

                  details.append(
                      f"{name}: Fehlende Strukturmerkmale: "
                      f"{missing}"
                  )

          Path(
              ".psx-structure-monitor-result"
          ).write_text(
              "ok\n"
              if overall_ok
              else "failed\n",
              encoding="utf-8",
          )

          Path(
              ".psx-structure-monitor-details"
          ).write_text(
              "\n".join(details)
              + ("\n" if details else ""),
              encoding="utf-8",
          )

          print(
              "BleemSync:",
              status_text(bleemsync),
          )

          print(
              "AutoBleem:",
              status_text(autobleem),
          )

          print(
              "Project Eris:",
              status_text(eris),
          )

          for detail in details:
              print(detail)
          PY

      - name: README-Status committen
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Der README-Status ist unverändert."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "chore: PSx Strukturstatus aktualisieren"

          for versuch in 1 2 3; do
            echo "Push-Versuch ${versuch} von 3"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort
              echo "README konnte nicht automatisch mit main zusammengeführt werden."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "README-Status erfolgreich aktualisiert."
              exit 0
            fi

            sleep 2
          done

          echo "README-Status konnte nach drei Versuchen nicht übertragen werden."
          exit 1

      - name: Monitor-Ergebnis überprüfen
        if: always()
        shell: bash
        run: |
          if [ ! -f .psx-structure-monitor-result ]; then
            echo "Die Ergebnisdatei des Struktur-Monitors fehlt."
            exit 1
          fi

          if [ "$(cat .psx-structure-monitor-result)" != "ok" ]; then
            cat .psx-structure-monitor-details
            exit 1
          fi

          echo "Alle überwachten Strukturen sind stabil."
