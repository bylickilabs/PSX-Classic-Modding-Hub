name: Feature Request
description: Schlage neue Funktionen, Tools, Automatisierungen, RetroArch-Optionen oder Erweiterungen für den PSX Classic Modding Hub vor.
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        # 🚀 Feature Request

        Vielen Dank für deinen Verbesserungsvorschlag für den PSX Classic Modding Hub.

        **Alle nachfolgenden Angaben sind verpflichtend.** Der Vorschlag soll technisch nachvollziehbar, klar abgegrenzt und hinsichtlich Nutzen sowie Auswirkungen bewertbar sein.

        Falls eine Angabe nicht bekannt ist, trage ausdrücklich `Nicht bekannt` ein. Falls ein Punkt nicht zutrifft, trage `Nicht zutreffend` ein. Pflichtfelder dürfen nicht leer bleiben.

  - type: dropdown
    id: feature_category
    attributes:
      label: Kategorie des Feature Requests
      description: Wähle den Bereich aus, zu dem der Vorschlag gehört.
      options:
        - Neue Funktion
        - Neues Tool
        - Automatisierung
        - RetroArch-Option oder Konfiguration
        - Core-Unterstützung
        - Controller- oder Eingabeunterstützung
        - Kompatibilitätsverbesserung
        - Dokumentation oder Workflow
        - Repository-Erweiterung
        - Sonstige Erweiterung
    validations:
      required: true

  - type: textarea
    id: feature_summary
    attributes:
      label: Beschreibung des gewünschten Features
      description: Beschreibe präzise, was hinzugefügt, geändert oder erweitert werden soll.
      placeholder: Was soll umgesetzt werden und wie soll die Funktion grundsätzlich arbeiten?
    validations:
      required: true

  - type: textarea
    id: problem_use_case
    attributes:
      label: Problem oder konkreter Anwendungsfall
      description: Beschreibe, welches bestehende Problem gelöst oder welcher konkrete Anwendungsfall verbessert werden soll.
      placeholder: Welches Problem besteht aktuell und wann tritt es auf?
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Vorgeschlagene Lösung
      description: Beschreibe die gewünschte technische oder funktionale Umsetzung so konkret wie möglich.
      placeholder: Wie sollte die Lösung aus deiner Sicht umgesetzt werden?
    validations:
      required: true

  - type: textarea
    id: expected_workflow
    attributes:
      label: Gewünschter Ablauf
      description: Beschreibe, wie ein Nutzer die neue Funktion verwenden soll.
      placeholder: |
        1. Nutzer öffnet ...
        2. Nutzer wählt ...
        3. Das System ...
        4. Ergebnis ...
    validations:
      required: true

  - type: textarea
    id: expected_benefit
    attributes:
      label: Erwarteter Nutzen
      description: Erläutere den konkreten Mehrwert für den PSX Classic Modding Hub und seine Nutzer.
      placeholder: Welchen messbaren oder praktischen Vorteil bringt die Erweiterung?
    validations:
      required: true

  - type: textarea
    id: affected_components
    attributes:
      label: Betroffene Komponenten
      description: Nenne alle Bereiche, die durch die Umsetzung betroffen sein könnten.
      placeholder: z. B. RetroArch, Core-Konfigurationen, Controller-Mappings, Skripte, Dokumentation, Tools oder Repository-Struktur
    validations:
      required: true

  - type: textarea
    id: compatibility_impact
    attributes:
      label: Auswirkungen auf bestehende Kompatibilität
      description: Beschreibe mögliche Auswirkungen auf vorhandene Konfigurationen, Controller, Cores, Spiele oder bestehende Funktionen. Falls keine erwartet werden, trage `Keine bekannt` ein.
      placeholder: Keine bekannt
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Bereits geprüfte Alternativen
      description: Beschreibe vorhandene Workarounds oder alternative Lösungen. Falls keine bekannt sind, trage `Keine bekannt` ein.
      placeholder: Keine bekannt
    validations:
      required: true

  - type: textarea
    id: technical_requirements
    attributes:
      label: Technische Anforderungen oder Abhängigkeiten
      description: Nenne bekannte technische Voraussetzungen, Abhängigkeiten, benötigte Tools, Bibliotheken, Cores oder RetroArch-Funktionen. Falls nicht bekannt, trage `Nicht bekannt` ein.
      placeholder: Nicht bekannt
    validations:
      required: true

  - type: textarea
    id: test_scenario
    attributes:
      label: Vorgeschlagenes Testszenario
      description: Beschreibe, wie die Umsetzung nach Fertigstellung praktisch getestet werden sollte.
      placeholder: Welche Hardware, welches System, welcher Core, welches Spiel oder welcher Ablauf sollte für den Test verwendet werden?
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Akzeptanzkriterien
      description: Definiere, wann das Feature aus deiner Sicht als erfolgreich umgesetzt gilt.
      placeholder: |
        - Funktion arbeitet wie beschrieben.
        - Bestehende Funktionen bleiben erhalten.
        - Das definierte Testszenario wird erfolgreich bestanden.
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Zusätzliche technische Informationen
      description: Ergänze weitere relevante Informationen, Referenzen oder Hinweise. Falls keine vorhanden sind, trage `Keine vorhanden` ein.
      placeholder: Keine vorhanden
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Bestätigung
      description: Bestätige vor dem Absenden die Vollständigkeit des Feature Requests.
      options:
        - label: Ich habe alle Pflichtfelder vollständig ausgefüllt und den Vorschlag so konkret wie möglich beschrieben.
          required: true
        - label: Ich habe geprüft, ob ein vergleichbarer Feature Request bereits als Issue existiert.
          required: true
